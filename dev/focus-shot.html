<!doctype html><html><head><meta charset="utf-8"><title>Cadrage — visuel du dépôt</title><style>
body{margin:0;background:#fff;font:13px system-ui}
#row{width:1280px;display:flex}
figure{margin:0}figcaption{text-align:center;color:#5a6b7d;padding:2px 0 10px}
</style></head><body><div id="row"></div>
<script type="module">
import { PRESETS } from '../src/data/presets.js';
import { normalise } from '../src/core/model.js';
import { renderScene } from '../src/render/svg.js';

/*
 * A plot with two things worth a widget of their own: the sliding gate on the
 * street side, and the pool behind the house. Kept compact on purpose — the
 * point of the first panel is that the gate is *there and unusable*, which a
 * plot so long that the gate is invisible does not make.
 */
const base = normalise({ ...PRESETS.find((p) => p.id === 'provence').model });
const model = normalise({
  ...base,
  ground: { ...base.ground, margin: 1 },
  props: [
    { kind: 'muret', x: 10, y: 11, w: 17, d: 0.3, h: 1.5 },
    { kind: 'gate', x: 15, y: 11, w: 1.1, d: 0.2, h: 1.5, style: 'swing' },
    { kind: 'gate', x: 20, y: 11, w: 3.6, d: 0.2, h: 1.5, style: 'slide' },
    { kind: 'terrace', x: 11, y: 27, w: 12, d: 7, material: 'paving' },
    { kind: 'pool', x: 13, y: 28.5, w: 7, d: 4 },
    { kind: 'tree', x: 26, y: 30, r: 1.8 },
  ],
});

// Seen from the south-west, so the walled frontage faces the reader instead of
// hiding behind the house.
const camera = { ...model.camera, yaw: 180 };
const shots = [
  ['Vue d’ensemble — le portail y fait quelques pixels', { camera }],
  ['Widget « portail »', { camera, focus: { enabled: true, x: 18, y: 9.5, w: 8, d: 3, margin: 1 } }],
  ['Widget « piscine »', { camera, focus: { enabled: true, x: 10.5, y: 27.5, w: 13, d: 7, margin: 1 } }],
];
document.getElementById('row').innerHTML = shots.map(([label, patch]) =>
  `<figure>${renderScene({ ...model, ...patch }, { width: 426, height: 300 }).svg}` +
  `<figcaption>${label}</figcaption></figure>`).join('');
</script></body></html>
