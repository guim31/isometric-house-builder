<!doctype html><html><head><meta charset="utf-8"><title>Visuels du dépôt</title><style>
body{margin:0;background:#fff;font:13px system-ui}
#hero{width:1280px;height:520px;display:flex;align-items:center;justify-content:center}
#grid{width:1280px;display:flex;flex-wrap:wrap}
figure{margin:0}figcaption{text-align:center;color:#5a6b7d;padding-bottom:8px}
</style></head><body><div id="hero"></div><div id="grid"></div>
<script type="module">
import { PRESETS } from '../src/data/presets.js';
import { normalise } from '../src/core/model.js';
import { renderScene } from '../src/render/svg.js';
import { viewpointLabel, DEFAULT_PITCH } from '../src/core/iso.js';

const of = (id) => normalise({ ...PRESETS.find((p) => p.id === id).model });
const hero = ['provence', 'chalet', 'passive'];
document.getElementById('hero').innerHTML = hero
  .map((id, i) => renderScene(of(id), { width: i === 0 ? 480 : 400, height: 500 }).svg).join('');

const g = document.getElementById('grid');
const a = of('pavillon');
const shot = (label, patch) => g.insertAdjacentHTML('beforeend',
  `<figure>${renderScene({ ...a, ...patch }, { width: 320, height: 240 }).svg}` +
  `<figcaption>${label}</figcaption></figure>`);

// The roof belongs to the volume, not to the model.
const withRoof = (type) => ({
  buildings: a.buildings.map((b) => ({ ...b, roof: { ...b.roof, type } })),
});
for (const [label, type] of [['Croupe', 'hip'], ['Deux pans', 'gable'],
  ['Toit plat', 'flat'], ['Appentis', 'shed']]) {
  shot(label, withRoof(type));
}
for (const yaw of [0, 90, 180, 270]) {
  shot(viewpointLabel(yaw), { camera: { ...a.camera, yaw } });
}
// Free orbit: the angles the four quarter turns cannot reach.
for (const [yaw, pitch] of [[28, DEFAULT_PITCH], [63, 22], [118, 52], [206, 14]]) {
  shot(`${yaw}° · hauteur ${Math.round(pitch)}°`, { camera: { ...a.camera, yaw, pitch } });
}
</script></body></html>
